name: Takeback
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Takeback:
    type: application
    platform: iOS
    sources:
      - path: Takeback
        excludes: [Resources, Info.plist]
      - path: Takeback/Resources
        buildPhase: resources
      - path: Vendor/secp256k1/src/secp256k1.c
      - path: Vendor/secp256k1/src/precomputed_ecmult.c
      - path: Vendor/secp256k1/src/precomputed_ecmult_gen.c
      - path: Vendor/bitcoin-core/crypto/ripemd160.cpp
    settings:
      base:
        # // TODO(owner): Existing ID retained; confirm App Store/shipping status and team before any identifier migration.
        PRODUCT_BUNDLE_IDENTIFIER: app.takeback.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Takeback
        PRODUCT_MODULE_NAME: Takeback
        TAKEBACK_SOURCE_URL: "https://github.com/devdasx/takeback"
        INFOPLIST_FILE: Takeback/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Takeback/Takeback-Bridging-Header.h
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lz"]
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ENABLE_MODULE_EXTRAKEYS=1", "ENABLE_MODULE_SCHNORRSIG=1"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/secp256k1/include", "$(SRCROOT)/Vendor/bitcoin-core"]
  TakebackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TakebackTests]
    dependencies:
      - target: Takeback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takeback.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  TakebackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TakebackUITests]
    dependencies:
      - target: Takeback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takeback.ios.uitests
        SWIFT_OBJC_BRIDGING_HEADER: TakebackUITests/TakebackUITests-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Takeback:
    build:
      targets:
        Takeback: all
        TakebackTests: [test]
        TakebackUITests: [test]
    test:
      targets: [TakebackTests, TakebackUITests]
      gatherCoverageData: true
