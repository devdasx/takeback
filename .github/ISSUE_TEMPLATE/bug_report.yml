name: Bug report
description: Report a reproducible, non-sensitive problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Never post keys, recovery phrases, passphrases, signing credentials, or unredacted financial data. For vulnerabilities, read SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a disposable fixture. Include Cancel or Speed up if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit, Xcode version, iOS version, device/simulator.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional screenshots or errors with no secret or personal data.
